name: rasq_client
description: "RASQ — plugin-based cross-platform SNS client (phase 1)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

workspace:
  - packages/rasq_models
  - packages/rasq_design
  - packages/rasq_overlay
  - packages/rasq_store
  - packages/rasq_plugin_api
  - packages/sns_misskey
  - packages/rrl_core
  - packages/rrl_renderer
  - packages/plugin_runtime
  - packages/rasq_ml

dependencies:
  flutter:
    sdk: flutter
  # Web 版の URL を path にする (D-456): Central の `/app/astell/<code>` などから直接その画面へ。
  flutter_web_plugins:
    sdk: flutter
  # 表示の言語 (D-484): gen-l10n(lib/l10n)と Material / Cupertino の訳、日付・数の書式。今は日本語だけ。
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.0
  # サーバーの登録ページをアプリの中で開く (D-412)。Android / iOS / macOS だけ(Linux / Windows / Web は外部のブラウザ)。
  webview_flutter: ^4.14.1
  crypto: ^3.0.3
  # ストア配布物の ed25519 署名検証 (D-034)。純 Dart 実装で全プラットフォーム同一。
  cryptography: ^2.9.0
  http: ^1.2.0
  http_parser: ^4.0.2
  # Web 版 (D-295): 安全でないコンテキスト(開発用の http)での保存先に localStorage を使う。
  web: ^1.1.1
  image_picker: ^1.1.2
  # 「囲って検索」の切り抜き・縮小・JPEG (D-418、pro_image_editor 経由で既に入っている版)。
  image: ^4.5.0
  # 動画 / 音声のファイル選択 (D-250: image_picker のギャラリーは音声を出せない)。
  file_selector: ^1.0.3
  rasq_models:
    path: packages/rasq_models
  rasq_design:
    path: packages/rasq_design
  rasq_overlay:
    path: packages/rasq_overlay
  rasq_store:
    path: packages/rasq_store
  rasq_plugin_api:
    path: packages/rasq_plugin_api
  sns_misskey:
    path: packages/sns_misskey
  rrl_core:
    path: packages/rrl_core
  rrl_renderer:
    path: packages/rrl_renderer
  plugin_runtime:
    path: packages/plugin_runtime
  rasq_ml:
    path: packages/rasq_ml
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  pro_image_editor: ^14.2.0
  material_ui: ^1.2.0
  # pro_image_editor の確認ダイアログは iOS / macOS で cupertino_ui のダイアログ(showAdaptiveDialog)になる (D-253)。
  cupertino_ui: ^1.0.2
  video_player: ^2.14.0
  pro_video_editor: ^2.12.0
  path_provider: ^2.1.6
  flutter_gemma: ^1.8.0
  flutter_gemma_litertlm: ^1.6.3
  # SigLIP2 テキスト塔の端末実行 (D-190) と RAi の 3D 描画 (D-191)。
  onnxruntime: ^1.4.1
  # Unicode NFKC (D-193: MiniLM の XLM-R トークナイザーの正規化)。
  unorm_dart: ^0.3.2
  three_js: ^0.3.0
  llama_cpp_dart: 0.9.0-dev.12
  device_info_plus: ^13.2.0
  archive: ^4.2.0
  ffi: ^2.2.0
  # チャイルドセーフのつなぐ / ログインのコードの QR (D-309)。純 Dart の描画(依存は qr だけ)で全プラットフォーム同じ。
  qr_flutter: ^4.1.0
  # AsTell の通話 (D-317): 音声だけの P2P メッシュ(シグナリングは Central の WS)。livekit_client と同じ版に揃える
  # (livekit_client が flutter_webrtc をこの版に固定している)。
  flutter_webrtc: ^1.6.2+hotfix.3
  # Web 版の通話の声 (D-318): 受けたトラックの中身(JS の MediaStreamTrack)を <audio> に繋ぐ。flutter_webrtc の Web 実装そのもの
  # (版は flutter_webrtc が決める)。
  dart_webrtc: ^1.8.2
  # AsTell の配信 (D-317): ホストの配信 / 画面共有の映像と、通話に入りきらない人の聞き取り(自前の LiveKit)。
  livekit_client: ^2.13.0
  # Android の画面の取り込みに要る前面サービス(mediaProjection、Android 14 から必須、D-317)。
  flutter_background: ^1.3.1
  # AsTell の WS を Web 版でも(dart:io の WebSocket はブラウザで動かない、D-317)。
  web_socket_channel: ^3.0.3
  audioplayers: ^6.8.1
  gal: ^2.3.3
  # 書き出し中の広告枠 (D-327): Android / iOS は AdMob(同意の UMP も同梱)。Web は AdSense をそのまま置く(依存は足さない)。
  google_mobile_ads: ^9.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # ホーム画面のアプリのショートカット (D-483、flutter.dev): iOS は Info.plist の静的な項目(SF Symbols)、Android は動的な項目。
  quick_actions: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 文言の生成 (D-484): l10n.yaml → lib/l10n/gen(生成物もコミットする。手順は docs/I18N.md)。
  generate: true
  assets:
    # Web 版 (D-299): .rasqpkg を開く zstd の復号(tool/zstd-wasm のビルド結果)。
    - assets/web/zstd.wasm
    # RAi のアイコン (D-180: obsidian-vault/RAi 動作リファレンス/アイコン案1.jpeg、外側の黒を透明に)。
    - assets/images/rai_icon.png
    - assets/audio/hold_music.wav
    - assets/audio/alarm.wav
    # RAi の 3D モデル (D-181: Google Drive で受領した glb。リグ arm_1..4 L/R / ear / head / cone / koma、
    # アニメ idle / run_* / accident。描画は後段 — 今はアセットとして保持)。
    - assets/models/rai.glb
    # RAi のリファレンス (D-189): 関数リファレンス / 操作リファレンス / 検索の評価セット(jsonl)。
    # SigLIP2 のトークナイザー (D-190: Gemma SentencePiece BPE、4 MB。ONNX 本体はダウンロード)。
    - assets/models/siglip2_tokenizer.model
    # MiniLM(XLM-R Unigram)の語彙 (D-193: id 順 piece \t score、7.7 MB)。ONNX 本体はダウンロード。
    - assets/models/minilm_unigram.tsv
    - assets/rai/functions.jsonl
    - assets/rai/operations.jsonl
    - assets/rai/eval.jsonl
    - assets/rai/face.png
    # 同梱モデル (D-216): `tool/fetch_rai_models.sh` で取得した gzip の GGUF(git には入れない)。
    - assets/rai_models/
    # misskey-wasm-sample plugin binary (built in rasq-sdk-sample; loaded by
    # the WASMプラグイン試験 dev screen).
    # 同梱のプラグインは tool/build_bundled_plugins.sh でソース(rasq-sdk-sample / plugin-sample の各リポジトリ)から作り、
    # 出どころ(リポジトリ / コミット / 版 / sha256)を SOURCES.json に書く (D-393)。ストアの同梱の掲載は版をここから読む。
    - assets/plugins/SOURCES.json
    - assets/plugins/misskey_wasm_sample.wasm
    # Mastodon SNS プラグイン (D-135)。sns.* 境界だけを実装した wasm。
    - assets/plugins/mastodon_wasm.wasm
    - assets/plugins/bluesky_wasm.wasm
    - assets/plugins/mixi2_wasm.wasm
    - assets/plugins/hello_rasq_plugin.wasm
    - assets/plugins/relational_wasm.wasm
    # スロットプラグインのサンプル (D-168: plugin-sample の各リポジトリ。ストアの同梱の掲載から
    # 「インストール」→ スロット登録される)。
    - assets/plugins/astell_plugin.wasm
    - assets/plugins/composer_media_plugin.wasm
    - assets/plugins/composer_text_plugin.wasm
    - assets/plugins/media_fullscreen_plugin.wasm
    - assets/plugins/post_process_plugin.wasm
    - assets/plugins/timeline_plugin.wasm
    - assets/plugins/trend_plugin.wasm
    - assets/plugins/post_share_plugin.wasm
    - assets/plugins/media_transform_plugin.wasm
    - assets/plugins/media_process_plugin.wasm
    - assets/plugins/media_draw_plugin.wasm
    - assets/plugins/post_action_plugin.wasm
    # カスタムプラグイン(ページ型)のサンプル「みんなのボード」(D-357、plugin-sample/custom-page-plugin)。
    - assets/plugins/custom_page_plugin.wasm
    # カスタムプラグインのサンプル「みんなで落書き」(D-465、plugin-sample/custom-plugin-paint、契約 v0.22)。
    - assets/plugins/custom_plugin_paint.wasm
    # 着せ替えのサンプル (D-335、plugin-sample/theme-plugin の rasq build)。
    - assets/plugins/theme_starry.rasqpkg
    - assets/plugins/theme_rasq.rasqpkg
    # ML model manifests (model-manifest.schema.json — resolved by MlGateway).
    - assets/models/
    # 設定第二階層の静的 RRL ページ (D-031, rasq.settings-page/1).
    - assets/settings/
