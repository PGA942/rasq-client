name: rasq_client
description: "RASQ — plugin-based cross-platform SNS client (phase 1)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

workspace:
  - packages/rasq_models
  - packages/rasq_design
  - packages/rasq_overlay
  - packages/rasq_store
  - packages/rasq_plugin_api
  - packages/sns_misskey
  - packages/rrl_core
  - packages/rrl_renderer
  - packages/plugin_runtime
  - packages/rasq_ml

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  # ストア配布物の ed25519 署名検証 (D-034)。純 Dart 実装で全プラットフォーム同一。
  cryptography: ^2.9.0
  http: ^1.2.0
  image_picker: ^1.1.2
  rasq_models:
    path: packages/rasq_models
  rasq_design:
    path: packages/rasq_design
  rasq_overlay:
    path: packages/rasq_overlay
  rasq_store:
    path: packages/rasq_store
  rasq_plugin_api:
    path: packages/rasq_plugin_api
  sns_misskey:
    path: packages/sns_misskey
  rrl_core:
    path: packages/rrl_core
  rrl_renderer:
    path: packages/rrl_renderer
  plugin_runtime:
    path: packages/plugin_runtime
  rasq_ml:
    path: packages/rasq_ml
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  pro_image_editor: ^14.2.0
  material_ui: ^1.2.0
  video_player: ^2.14.0
  pro_video_editor: ^2.12.0
  path_provider: ^2.1.6
  flutter_gemma: ^1.8.0
  flutter_gemma_litertlm: ^1.6.3
  llama_cpp_dart: ^0.2.2
  device_info_plus: ^13.2.0
  archive: ^4.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # RAi のアイコン (D-180: obsidian-vault/RAi 動作リファレンス/アイコン案1.jpeg、外側の黒を透明に)。
    - assets/images/rai_icon.png
    # RAi の 3D モデル (D-181: Google Drive で受領した glb。リグ arm_1..4 L/R / ear / head / cone / koma、
    # アニメ idle / run_* / accident。描画は後段 — 今はアセットとして保持)。
    - assets/models/rai.glb
    # misskey-wasm-sample plugin binary (built in rasq-sdk-sample; loaded by
    # the WASMプラグイン試験 dev screen).
    - assets/plugins/misskey_wasm_sample.wasm
    # Mastodon SNS プラグイン (D-135)。sns.* 境界だけを実装した wasm。
    - assets/plugins/mastodon_wasm.wasm
    - assets/plugins/bluesky_wasm.wasm
    - assets/plugins/hello_rasq_plugin.wasm
    - assets/plugins/relational_wasm.wasm
    # スロットプラグインのサンプル (D-168: plugin-sample の dist/。ストアのダミー掲載から
    # 「インストール」→ スロット登録される)。
    - assets/plugins/astell_plugin.wasm
    - assets/plugins/composer_media_plugin.wasm
    - assets/plugins/composer_text_plugin.wasm
    - assets/plugins/media_fullscreen_plugin.wasm
    - assets/plugins/post_process_plugin.wasm
    - assets/plugins/timeline_plugin.wasm
    - assets/plugins/trend_plugin.wasm
    - assets/plugins/post_share_plugin.wasm
    - assets/plugins/media_transform_plugin.wasm
    - assets/plugins/media_process_plugin.wasm
    - assets/plugins/media_draw_plugin.wasm
    - assets/plugins/post_action_plugin.wasm
    # ML model manifests (model-manifest.schema.json — resolved by MlGateway).
    - assets/models/
    # 設定第二階層の静的 RRL ページ (D-031, rasq.settings-page/1).
    - assets/settings/
