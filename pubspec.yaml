name: rasq_client
description: "RASQ — plugin-based cross-platform SNS client (phase 1)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

workspace:
  - packages/rasq_models
  - packages/rasq_design
  - packages/rasq_overlay
  - packages/rasq_store

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  rasq_models:
    path: packages/rasq_models
  rasq_design:
    path: packages/rasq_design
  rasq_overlay:
    path: packages/rasq_overlay
  rasq_store:
    path: packages/rasq_store

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
