# RASQ client CI
# - Flutter: analyze + test for the workspace (app + packages/*)
# - The workspace needs Dart >= 3.13 (pub workspaces). ghcr.io/cirruslabs/flutter has
#   no 3.47.x tag, so the job starts from the 3.44.0 image and switches the SDK
#   checkout to the pinned tag (FLUTTER_PIN) in before_script.
# - packages/plugin_runtime depends on ../rasq-sdk-sample/rasq_wasm_runtime
#   (sibling checkout), whose build hook runs cargo. CI therefore:
#     1. clones rasq-sdk-sample next to this project (CI_JOB_TOKEN — the
#        rasq-sdk-sample project must allow this project in
#        Settings > CI/CD > Job token permissions)
#     2. installs a minimal Rust toolchain + wasm32 target
#     3. builds misskey-wasm-sample so the wasm-dependent tests run instead of skipping
# - GitLab security templates (SAST / Secret Detection) kept from the initial setup
# - 静的チェック (README「静的チェック」): semgrep (このコードベースの約束)、osv (依存の既知の脆弱性)、
#   deny (tool/zstd-wasm の Rust 依存)。flutter ジョブの `flutter analyze` は analysis_options.yaml の
#   strict-casts と lint で見る。
stages:
- test
- secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  SDK_SAMPLE_BRANCH: "main"
  FLUTTER_PIN: "3.47.2"

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection

flutter:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.44.0
  cache:
    key: pub-$CI_COMMIT_REF_SLUG
    paths:
      - .pub-cache/
      - .cargo/
  before_script:
    # cirruslabs のイメージは 3.44.0 までしか無い(3.47.x は manifest unknown)。
    # 3.44.0 のイメージに入っている Flutter の checkout を 3.47.2 のタグへ切り替える(Dart 3.13 が要る)。
    - git config --global --add safe.directory "$FLUTTER_HOME"
    - git -C "$FLUTTER_HOME" fetch --depth 1 origin "refs/tags/$FLUTTER_PIN:refs/tags/$FLUTTER_PIN"
    - git -C "$FLUTTER_HOME" checkout -q "$FLUTTER_PIN"
    - flutter --version
    # Sibling checkout of the SDK repo (path dependency of plugin_runtime).
    # 対になる SDK 側の変更は同じ名前のブランチで出す: あればそれを、無ければ
    # SDK_SAMPLE_BRANCH (main) を使う。2 つの MR にまたがる変更を、SDK を先に
    # マージしなくても検証できるようにするため。
    - |
      SDK_DIR="$CI_PROJECT_DIR/../rasq-sdk-sample"
      SDK_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/orgate-question/rasq-sdk-sample.git"
      rm -rf "$SDK_DIR"
      for b in "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}" "$SDK_SAMPLE_BRANCH"; do
        if git clone --depth 1 -b "$b" "$SDK_URL" "$SDK_DIR" 2>/dev/null; then echo "rasq-sdk-sample: branch $b"; break; fi
      done
      [ -d "$SDK_DIR" ] || git clone --depth 1 "$SDK_URL" "$SDK_DIR"
    # Rust for the rasq_wasm_runtime build hook (host dylib) and the wasm sample.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup target add wasm32-unknown-unknown
    # wasm 依存のテスト(misskey サンプル / Mastodon プラグイン)を
    # スキップさせないため、両方ビルドしてから走らせる。
    - (cd "$CI_PROJECT_DIR/../rasq-sdk-sample/rust" && cargo build --release --target wasm32-unknown-unknown -p misskey-wasm-sample -p mastodon-wasm -p bluesky-wasm)
  script:
    - flutter --version
    - flutter pub get
    - flutter analyze
    - flutter test
    - for p in packages/*; do (cd "$p" && flutter test); done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# このコードベースの約束 (.semgrep/)。規則の例で規則そのものを確かめてから、lib / packages / test / tool / web に掛ける。
# `--test` は隠しディレクトリ (.semgrep) の中の例を見つけないので、いったん写してから回す。
semgrep:
  stage: test
  image: semgrep/semgrep:1.177.0
  script:
    - rm -rf /tmp/semgrep-rules && cp -r .semgrep /tmp/semgrep-rules && semgrep --test --metrics=off /tmp/semgrep-rules
    - semgrep scan --metrics=off --error --config .semgrep --exclude .semgrep --exclude build --exclude .dart_tool --exclude vendor lib packages test tool web
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# 依存の既知の脆弱性 (OSV): pub のロック (pubspec.lock) と、Web 版の zstd の wasm (tool/zstd-wasm/Cargo.lock)。
# `dart pub outdated` は新しさを見るだけで脆弱性は見ないので、別に回す。スケジュール実行でも回す
# (コードが変わらなくても、新しい脆弱性が出たら気づくため)。
osv:
  stage: test
  image:
    name: ghcr.io/google/osv-scanner:v2.6.0
    entrypoint: [""]
  script:
    - osv-scanner scan --lockfile pubspec.lock --lockfile tool/zstd-wasm/Cargo.lock
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# tool/zstd-wasm (Web 版の zstd 復号) の Rust 依存: RustSec・ライセンス・出どころ (deny.toml)。
# 端末版のランタイム (rasq_wasm_runtime) は rasq-sdk-sample 側にあり、そちらの CI で見る。
deny:
  stage: test
  image: rust:1
  variables:
    CARGO_DENY_VERSION: "0.20.2"
  script:
    - curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz --strip-components=1 -C /usr/local/bin
    - cd tool/zstd-wasm && cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Web 版 (D-295 → D-303): ブラウザでしか出ない壊れ方(three_js の 3D で、アプリ全体が起動しなくなった)を
# 手元と同じやり方で止める。`test/web` はブラウザの中で走るので Chrome が要る(イメージには入っていないので入れる)。
web:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.44.0
  cache:
    key: pub-$CI_COMMIT_REF_SLUG
    paths:
      - .pub-cache/
  before_script:
    - git config --global --add safe.directory "$FLUTTER_HOME"
    - git -C "$FLUTTER_HOME" fetch --depth 1 origin "refs/tags/$FLUTTER_PIN:refs/tags/$FLUTTER_PIN"
    - git -C "$FLUTTER_HOME" checkout -q "$FLUTTER_PIN"
    # plugin_runtime は rasq-sdk-sample への path 依存(ビルドフックが cargo を呼ぶ)。
    - |
      SDK_DIR="$CI_PROJECT_DIR/../rasq-sdk-sample"
      rm -rf "$SDK_DIR"
      git clone --depth 1 -b "$SDK_SAMPLE_BRANCH" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/orgate-question/rasq-sdk-sample.git" "$SDK_DIR" \
        || git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/orgate-question/rasq-sdk-sample.git" "$SDK_DIR"
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
    # Web のテストを走らせるブラウザ(イメージには入っていない)。
    - curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends /tmp/chrome.deb && rm -f /tmp/chrome.deb
    - export CHROME_EXECUTABLE=/usr/bin/google-chrome
  script:
    - flutter pub get
    - flutter build web --no-tree-shake-icons
    - flutter test --platform chrome test/web
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
