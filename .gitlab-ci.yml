# RASQ client CI
# - Flutter: analyze + test for the workspace (app + packages/*)
# - GitLab security templates (SAST / Secret Detection) kept from the initial setup
stages:
- test
- secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection

flutter:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  cache:
    key: pub-$CI_COMMIT_REF_SLUG
    paths:
      - .pub-cache/
  script:
    - flutter --version
    - flutter pub get
    - flutter analyze
    - flutter test
    - for p in packages/*; do (cd "$p" && flutter test); done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
