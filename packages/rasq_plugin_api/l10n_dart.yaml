# 部品(rasq_plugin_api)の文言 (D-533)。Flutter に依らない部品なので flutter gen-l10n ではなく tool/l10n_merge.dart が
# lib/l10n/parts/*.<言語>.arb から lib/l10n/pluginapi_<言語>.arb と lib/l10n/gen(素の Dart のクラス)を作る。手順はアプリの docs/I18N.md。
arb-dir: lib/l10n
template-arb-file: pluginapi_ja.arb
output-dir: lib/l10n/gen
output-localization-file: rasq_plugin_api_localizations.dart
output-class: RasqPluginApiLocalizations
