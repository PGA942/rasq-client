name: plugin_runtime
description: "Hosts a RASQ WASM plugin (wasmi via rasq_wasm_runtime): snapshot/patch -> RrlDocument, events -> call, host functions."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1
  flutter: ">=3.35.0"

dependencies:
  # Web 版 (D-297): Web Worker / Blob (dart:js_interop)。
  web: ^1.1.1
  flutter:
    sdk: flutter
  rrl_core:
    path: ../rrl_core
  rrl_renderer:
    path: ../rrl_renderer
  rasq_design:
    path: ../rasq_design
  rasq_models:
    path: ../rasq_models
  rasq_plugin_api:
    path: ../rasq_plugin_api
  # FollowState(関係の状態)— sns.relationships / sns.setRelation の取り込み先。
  rasq_store:
    path: ../rasq_store
  # SDK repo checkout, side by side with rasq-client (M3 scaffolding; becomes
  # a hosted/git dependency once the SDK stabilises).
  rasq_wasm_runtime:
    path: ../../../rasq-sdk-sample/rasq_wasm_runtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  # ブラウザのテスト (test/web) の spawnHybridUri で立てるローカル HTTP サーバー (D-453)。
  stream_channel: ^2.1.0
  flutter_lints: ^6.0.0
