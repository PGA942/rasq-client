name: rasq_design
description: RASQ design tokens, theme, and L2 standard components (host-owned).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1
  flutter: ">=3.35.0"

dependencies:
  # Web 版 (D-298): ブラウザの見分け(画像の出し方)。
  web: ^1.1.1
  flutter:
    sdk: flutter
  # 部品の文言 (D-484): このパッケージの gen-l10n(lib/l10n/gen)と、日付の書式。
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  rasq_models:
    path: ../rasq_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # 部品の文言の生成 (D-484): l10n.yaml → lib/l10n/gen(生成物もコミットする)。
  generate: true
  # Brand assets (特殊なコンポーネント置き場 → background keyed out, downsized).
  # Referenced with `package: 'rasq_design'` from `RasqLogo` / `RasqBrandIcon` /
  # `RasqVerifiedBadge` / `RasqAsTellIcon` in src/components/brand.dart.
  assets:
    - assets/brand/
