# アナライザーの設定。`flutter analyze` がルート + packages/* に掛ける(packages/* の
# analysis_options.yaml はこのファイルを include している)。CI の `flutter` ジョブが回す。
#
# flutter_lints の推奨に加えて、このコードベースでは次を締めている:
# - strict-casts: dynamic が黙って別の型に化けない(暗黙のダウンキャストを禁じる)。
#   プラグインの応答 JSON や host-fn の引数を辿るコードで、型の抜けをそのまま実行時まで持ち越さないため。
# - avoid_dynamic_calls: dynamic への呼び出しは、上と同じ理由で「ここは dynamic のまま辿る」と
#   書いたファイルだけ(three_js の API・host-fn の応答を辿るテスト。`// ignore_for_file` と理由を並べる)。
# - avoid_print / avoid_web_libraries_in_flutter / only_throw_errors などの、崩れたら気づきたい約束。
#
# 数が多くて今は入れていないもの(入れるなら、まとめて直してから):
#   strict-inference (45 か所、ほぼテストの `[]` / `{}` リテラル) / strict-raw-types (17 か所、`as Map` の型引数 —
#   jsonDecode 以外の Map に型を付けると実行時に落ちうるので、機械的には直せない) /
#   discarded_futures (約 200) / unawaited_futures (約 120) / avoid_catches_without_on_clauses (約 270) /
#   avoid_slow_async_io (20) / use_string_buffers (3) / close_sinks・cancel_subscriptions (誤検知が多い)。
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
  exclude:
    - build/**
    - .semgrep/**   # Semgrep の規則の例(コンパイルしない)
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # 規則の一覧と説明: https://dart.dev/lints
  # 1 行 / 1 ファイルだけ外すときは `// ignore: <rule>` / `// ignore_for_file: <rule>` と理由を書く。
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    avoid_type_to_string: true
    avoid_web_libraries_in_flutter: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    only_throw_errors: true
    prefer_void_to_null: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
